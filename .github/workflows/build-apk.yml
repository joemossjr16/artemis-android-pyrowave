name: Build Pyrollo APK

on:
  workflow_dispatch:
  push:
    branches: [ pyrowave ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Pyrollo debug APK (nonRoot_game)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRoot_gameDebug

      - uses: actions/upload-artifact@v5
        with:
          name: pyrollo-nonRoot_game-debug
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
